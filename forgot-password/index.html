<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | ZipSurf</title>

    <!-- CoolAlert CDN -->
    <script src="https://cdn.jsdelivr.net/npm/coolalertjs@latest/dist/coolalert.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Outfit", "sans-serif"],
            },
            colors: {
              brand: {
                dark: "#0f172a",
                primary: "#0ea5e9",
                accent: "#22d3ee",
              },
              primary: "#0ea5e9",
              secondary: "#0369a1",
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          },
        },
      };
    </script>
  </head>
  <body class="font-sans antialiased bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen flex transition-colors duration-300">
    
    <!-- Left Split (Visual) -->
    <div class="hidden lg:flex lg:w-1/2 bg-slate-900 relative overflow-hidden items-center justify-center p-12">
      <!-- Decorative Background Elements -->
      <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"></div>
      <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-brand-primary/20 blur-3xl"></div>
      <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-96 h-96 rounded-full bg-brand-accent/20 blur-3xl"></div>
      
      <!-- Content -->
      <div class="relative z-10 text-white max-w-lg">
        <a href="../merge.html" class="inline-flex items-center gap-2 mb-12 group">
           <div class="bg-white/10 backdrop-blur-md p-2 rounded-xl border border-white/10">
              <img src="../assets/zipsurf-logo.png" alt="Logo" class="h-8 w-8 invert opacity-90">
           </div>
           <span class="text-2xl font-bold tracking-tight">Zipsurf</span>
        </a>

        <h2 class="text-4xl font-bold leading-tight mb-6">Password recovery.</h2>
        <p class="text-lg text-slate-300 mb-8 leading-relaxed">
          Don't worry, it happens to the best of us. We'll send you a link to reset your password and get you back online in no time.
        </p>
      </div>
    </div>

    <!-- Right Split (Form) -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 lg:p-12 relative">
      <!-- Theme Toggle (Absolute Top Right) -->
      <button
        id="theme-toggle"
        class="absolute top-6 right-6 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors"
        aria-label="Toggle theme"
      >
        <svg id="theme-icon" class="w-6 h-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <!-- Icon injected by JS -->
        </svg>
      </button>

      <!-- Mobile Logo -->
      <a href="../merge.html" class="lg:hidden absolute top-6 left-6 flex items-center gap-2">
         <img src="../assets/zipsurf-logo.png" alt="Logo" class="h-8 w-8 dark:invert-0 invert">
         <span class="font-bold text-xl text-gray-900 dark:text-white">Zipsurf</span>
      </a>

      <div class="w-full max-w-md animate-fade-in-up">
        <div class="text-center lg:text-left mb-10">
          <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Forgot Password?</h1>
          <p class="text-gray-500 dark:text-slate-400">
            Enter the email associated with your account.
          </p>
        </div>

        <form id="forgot-form" class="space-y-6">
          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5">Email address</label>
            <div class="relative">
              <input
                type="email"
                id="email"
                name="email"
                class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-primary focus:border-transparent outline-none transition-all pl-11"
                placeholder="you@example.com"
                required
              />
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-brand-primary/20 text-sm font-semibold text-white bg-brand-primary hover:bg-brand-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary transition-all transform hover:-translate-y-0.5"
          >
            Send Reset Instructions
          </button>
        </form>

        <div class="mt-8 text-center">
          <a href="../login/index.html" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">
            <svg class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to log in
          </a>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script type="module">
      import { Ui } from '../scripts/utils.js';

      // --- Theme Logic ---
      const themeBtn = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      
      const moonPath = "M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z";
      const sunPath = "M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z";

      function updateTheme(isDark) {
        if (isDark) {
          document.documentElement.classList.add('dark');
          localStorage.theme = 'dark';
          themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${sunPath}" />`;
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.theme = 'light';
          themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${moonPath}" />`;
        }
      }

      const prefersDark = localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches);
      updateTheme(prefersDark);

      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.contains('dark');
        updateTheme(!isDark);
      });

      // --- Form Logic ---
      const form = document.getElementById('forgot-form');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = 'Sending...';

        await new Promise(r => setTimeout(r, 1200));

        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
        
        await Ui.alert('success', 'Check your email', 'We sent instructions to the email provided.');
        
        // For demo purposes, we can redirect to the change-password page to show it
        // In reality, this would be a link in the email
         window.location.href = '../change-password/index.html';
      });
    </script>
  </body>
</html>
