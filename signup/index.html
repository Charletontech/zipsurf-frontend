<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | ZipSurf</title>

    <!-- CoolAlert CDN -->
    <script src="https://cdn.jsdelivr.net/npm/coolalertjs@latest/dist/coolalert.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Outfit", "sans-serif"],
            },
            colors: {
              brand: {
                dark: "#0f172a",
                primary: "#0ea5e9",
                accent: "#22d3ee",
              },
              primary: "#0ea5e9",
              secondary: "#0369a1",
            },
            animation: {
              "fade-in-up": "fadeInUp 0.6s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="font-sans antialiased bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen flex transition-colors duration-300"
  >
    <!-- Left Split (Visual) -->
    <div
      class="hidden lg:flex lg:w-1/2 bg-slate-900 relative overflow-hidden items-center justify-center p-12"
    >
      <!-- Decorative Background Elements -->
      <div
        class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"
      ></div>
      <div
        class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-brand-primary/20 blur-3xl"
      ></div>
      <div
        class="absolute bottom-0 left-0 -ml-20 -mb-20 w-96 h-96 rounded-full bg-brand-accent/20 blur-3xl"
      ></div>

      <!-- Content -->
      <div class="relative z-10 text-white max-w-lg">
        <a
          href="../merge.html"
          class="inline-flex items-center gap-2 mb-12 group"
        >
          <div
            class="bg-white/10 backdrop-blur-md p-2 rounded-xl border border-white/10"
          >
            <img
              src="../assets/zipsurf-logo.png"
              alt="Logo"
              class="h-8 w-8 invert opacity-90"
            />
          </div>
          <span class="text-2xl font-bold tracking-tight">Zipsurf</span>
        </a>

        <h2 class="text-4xl font-bold leading-tight mb-6">
          Join the high-speed revolution today.
        </h2>
        <p class="text-lg text-slate-300 mb-8 leading-relaxed">
          Create an account to unlock gigabit speeds, secure browsing, and
          pay-as-you-go flexibility at any of our centers.
        </p>

        <div class="flex items-center gap-4 text-sm text-slate-400">
          <div class="flex -space-x-2">
            <img
              class="inline-block h-8 w-8 rounded-full ring-2 ring-slate-900 grayscale opacity-70"
              src="https://i.pravatar.cc/100?img=4"
              alt=""
            />
            <img
              class="inline-block h-8 w-8 rounded-full ring-2 ring-slate-900 grayscale opacity-70"
              src="https://i.pravatar.cc/100?img=5"
              alt=""
            />
            <img
              class="inline-block h-8 w-8 rounded-full ring-2 ring-slate-900 grayscale opacity-70"
              src="https://i.pravatar.cc/100?img=6"
              alt=""
            />
          </div>
          <p>Join the community.</p>
        </div>
      </div>
    </div>

    <!-- Right Split (Form) -->
    <div
      class="w-full lg:w-1/2 flex items-center justify-center p-8 lg:p-12 relative"
    >
      <!-- Theme Toggle (Absolute Top Right) -->
      <button
        id="theme-toggle"
        class="absolute top-6 right-6 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors"
        aria-label="Toggle theme"
      >
        <svg
          id="theme-icon"
          class="w-6 h-6 text-gray-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <!-- Icon injected by JS -->
        </svg>
      </button>

      <!-- Mobile Logo (Only visible on small screens) -->
      <a
        href="../merge.html"
        class="lg:hidden absolute top-6 left-6 flex items-center gap-2"
      >
        <img
          src="../assets/zipsurf-logo.png"
          alt="Logo"
          class="h-8 w-8 dark:invert-0 invert"
        />
        <span class="font-bold text-xl text-gray-900 dark:text-white"
          >Zipsurf</span
        >
      </a>

      <div class="w-full max-w-lg animate-fade-in-up">
        <div class="text-center lg:text-left mb-10">
          <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">
            Create an account
          </h1>
          <p class="text-gray-500 dark:text-slate-400">
            Already have an account?
            <a
              href="../login/index.html"
              class="text-brand-primary font-medium hover:text-brand-secondary transition-colors"
              >Log in</a
            >
          </p>
        </div>

        <form id="signup-form" class="space-y-5">
          <!-- Name -->
          <div>
            <label
              for="name"
              class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5"
              >Full Name</label
            >
            <div class="relative">
              <input
                type="text"
                id="name"
                name="name"
                class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-primary focus:border-transparent outline-none transition-all pl-11"
                placeholder="John Doe"
                required
              />
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <svg
                  class="h-5 w-5 text-gray-400"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                  />
                </svg>
              </div>
            </div>
          </div>

          <!-- Email & Phone Group -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5"
                >Email Address</label
              >
              <div class="relative">
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-primary focus:border-transparent outline-none transition-all pl-11"
                  placeholder="you@example.com"
                  required
                />
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <svg
                    class="h-5 w-5 text-gray-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                    />
                  </svg>
                </div>
              </div>
            </div>
            <div>
              <label
                for="phone"
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5"
                >Phone Number</label
              >
              <div class="relative">
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-primary focus:border-transparent outline-none transition-all pl-11"
                  placeholder="(555) 000-0000"
                  required
                />
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <svg
                    class="h-5 w-5 text-gray-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- Password Group -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5"
                >Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-primary focus:border-transparent outline-none transition-all pl-11"
                  placeholder="••••••••"
                  required
                  minlength="5"
                />
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <svg
                    class="h-5 w-5 text-gray-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                </div>
              </div>
            </div>
            <div>
              <label
                for="confirm-password"
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1.5"
                >Confirm Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-primary focus:border-transparent outline-none transition-all pl-11"
                  placeholder="••••••••"
                  required
                />
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <svg
                    class="h-5 w-5 text-gray-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- Terms -->
          <div class="flex items-start">
            <div class="flex items-center h-5">
              <input
                id="terms"
                name="terms"
                type="checkbox"
                class="h-4 w-4 text-brand-primary focus:ring-brand-primary border-gray-300 rounded bg-gray-50 dark:bg-slate-800 dark:border-slate-700 cursor-pointer"
                required
              />
            </div>
            <div class="ml-3 text-sm">
              <label
                for="terms"
                class="font-medium text-gray-700 dark:text-slate-300"
                >I agree to the
                <a
                  href="#"
                  class="text-brand-primary hover:text-brand-accent underline"
                  >Terms and Conditions</a
                ></label
              >
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-brand-primary/20 text-sm font-semibold text-white bg-brand-primary hover:bg-brand-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary transition-all transform hover:-translate-y-0.5"
          >
            Create Account
          </button>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script type="module">
      import { Ui, Api } from "../scripts/utils.js";

      // --- Theme Logic ---
      const themeBtn = document.getElementById("theme-toggle");
      const themeIcon = document.getElementById("theme-icon");

      const moonPath =
        "M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z";
      const sunPath =
        "M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z";

      function updateTheme(isDark) {
        if (isDark) {
          document.documentElement.classList.add("dark");
          localStorage.theme = "dark";
          themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${sunPath}" />`;
        } else {
          document.documentElement.classList.remove("dark");
          localStorage.theme = "light";
          themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${moonPath}" />`;
        }
      }

      const prefersDark =
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      updateTheme(prefersDark);

      themeBtn.addEventListener("click", () => {
        const isDark = document.documentElement.classList.contains("dark");
        updateTheme(!isDark);
      });

      // --- Form Logic ---
      const form = document.getElementById("signup-form");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm-password");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Validation
        if (passwordInput.value !== confirmInput.value) {
          Ui.toast("error", "Error", "Passwords do not match!");
          return;
        }

        if (passwordInput.value.length < 8) {
          Ui.toast(
            "warning",
            "Weak Password",
            "Password must be at least 8 characters."
          );
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = "Creating Account...";

        try {
          const response = await Api.post("/auth/register", {
            name: nameInput.value,
            email: emailInput.value,
            password: passwordInput.value,
          });

          // Save Token & User
          localStorage.setItem("token", response.data.token);
          localStorage.setItem("user", JSON.stringify(response.data.user));

          await Ui.alert(
            "success",
            "Account Created!",
            "Your account has been successfully created. Redirecting to dashboard..."
          );

          form.reset();
          window.location.href = "../dashboard/index.html";
        } catch (err) {
          Ui.toast("error", "Registration Failed", err.message);
          submitBtn.innerText = originalText;
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
